# Scala CircleCI 2.1 configuration file
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/openjdk:17.0

    working_directory: ~/Comparer

    environment:
      JVM_OPTS: -Xmx3200m
      TERM: dumb

    steps:
      - checkout

      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "build.sbt" }}-{{ checksum "project/build.properties" }}
            - v2-dependencies-

      # The + prefix runs each task for every version in crossScalaVersions (Scala 3 and 2.13).
      - run:
          name: Compile
          command: sbt +Test/compile

      - save_cache:
          paths:
            - ~/.sbt
            - ~/.ivy2/cache
            - ~/.cache/coursier
          key: v2-dependencies-{{ checksum "build.sbt" }}-{{ checksum "project/build.properties" }}

      - run:
          name: Test
          command: sbt +test

workflows:
  version: 2
  build-and-test:
    jobs:
      - build
