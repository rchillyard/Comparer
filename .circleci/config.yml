# Scala CircleCI 2.1 configuration file
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/openjdk:17.0

    working_directory: ~/Comparer

    environment:
      JVM_OPTS: -Xmx3200m
      TERM: dumb

    steps:
      - checkout

      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "build.sbt" }}-{{ checksum "project/build.properties" }}
            - v2-dependencies-

      - run:
          name: Compile
          command: sbt Test/compile

      - save_cache:
          paths:
            - ~/.sbt
            - ~/.ivy2/cache
            - ~/.cache/coursier
          key: v2-dependencies-{{ checksum "build.sbt" }}-{{ checksum "project/build.properties" }}

      - run:
          name: Test
          command: sbt test

      # The library is built with Scala 3.3 (LTS) but should also work on the current LTS.
      - run:
          name: Test (Scala 3.9)
          command: sbt "++3.9.0!" test

workflows:
  version: 2
  build-and-test:
    jobs:
      - build
